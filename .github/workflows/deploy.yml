name: CI/CD Pipeline

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Удалите шаг "Set up Docker Buildx"
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      # Обычный docker login вместо docker/login-action:
      # на раннере не скачиваются экшены (codeload.github.com отваливается по таймауту).
      - name: Build Docker image
        run: |
          docker build -t website-tattoos:latest .

      - name: Deploy on server
        timeout-minutes: 15
        run: |
          mkdir -p /home/server/data/images /home/server/backups
          cp docker-compose.yml /home/server/website-tattoos/
          cd /home/server/website-tattoos
          docker compose down || true
          docker compose up -d --remove-orphans --pull=never
          docker image prune -af --filter "until=168h" || true
          sudo nginx -t && sudo systemctl reload nginx || true
