name: CI/CD Pipeline

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Удалите шаг "Set up Docker Buildx"
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Замените "Build and push Docker image" на обычный run
      - name: Build and push Docker image
        run: |
          docker build -t reshetnikovdimmi/website-tattoos:latest .
          docker push reshetnikovdimmi/website-tattoos:latest

      - name: Deploy on server
        run: |
          mkdir -p /home/server/data/images /home/server/backups
          cp docker-compose.yml /home/server/website-tattoos/
          cd /home/server/website-tattoos
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -af --filter "until=168h" || true
          sudo nginx -t && sudo systemctl reload nginx || true
