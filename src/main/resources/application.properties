# ???????? ?????????
spring.application.name=maxsim
server.port=8080

# ???????? ??????? (?? ????????? dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ????????? ???? ?????? MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/a0722849_maxsim
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:a0722849_maxsim}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ????????? JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ????????? Thymeleaf (HTML ???????)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ??????????? ??? ?????? ??????????
logging.level.ru.tattoo.maxsim=DEBUG
logging.level.ru.tattoo.maxsim.service=DEBUG
logging.level.ru.tattoo.maxsim.controller=DEBUG

# ???????? debug ??? ????????
logging.level.org.springframework.aop=DEBUG
logging.level.ru.tattoo.maxsim.config.aspect=DEBUG

# ?????? ?????
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ???? SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ????????? ???????????
spring.web.resources.cache.cachecontrol.max-age=86400
spring.web.resources.cache.cachecontrol.must-revalidate=true

# ????? ??? ????????????
spring.main.allow-bean-definition-overriding=true

# Allure ?????
allure.results.directory=target/allure-results

# ==============================================
# ????????? ???????? ??????
# ==============================================
upload.max-file-size=10485760
upload.allowed-types=image/jpeg,image/png,image/gif,image/webp

# ???? ??? ???????? (????? ????????????? ? ????????)
app.storage.upload-dir=uploads/images

# Ключ шифрования токена Яндекс.Диска (AES-256, base64). Задаётся ТОЛЬКО через окружение:
#   openssl rand -base64 32  ->  BACKUP_ENCRYPTION_KEY в .env сервера
backup.encryption.key=${BACKUP_ENCRYPTION_KEY:}


# --- Бэкапы на Яндекс.Диск ---
# Путь к mysqldump. Пусто = автопоиск mysqldump / mariadb-dump в PATH.
# Локально без клиента MySQL: sudo apt install mysql-client
#app.backup.mysqldump-path=/usr/bin/mysqldump
# Включать архив картинок в бэкап (по умолчанию true)
#app.backup.include-images=true
# Таймаут дампа в минутах (по умолчанию 15)
#app.backup.dump-timeout-minutes=15
# Сколько последних бэкапов хранить на Диске, 0 = не удалять старые (по умолчанию 14)
#app.backup.keep=14
# Расписание автобэкапа (Spring cron, по умолчанию каждый день в 3:00)
#app.backup.cron=0 0 3 * * *
