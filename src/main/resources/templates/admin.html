<!DOCTYPE HTML>
<html xmlns:th="http://www.btn-close.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>admin</title>
    <link th:each="current: ${setting}" th:if="${current.section=='logo'}" th:href="@{'/images/'+${current.imageName}}"
          rel="icon" type="image/vnd.microsoft.icon">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,500,600,700&display=swap" rel="stylesheet">
    <!-- Css Styles -->

    <link rel="stylesheet" th:href="@{/static/css/bootstrap.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/font-awesome.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/elegant-icons.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/nice-select.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/owl.carousel.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/magnific-popup.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/slicknav.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/main.css}" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mixitup/3.3.2/mixitup.min.css">
</head>


<body>
<!-- Header Section Begin -->
<div th:replace="~{fragments::header}"></div>
<!-- Header End -->
<!-- Breadcrumb Section Begin -->

<!-- ============================================
     ACTIVITAR ADMIN BREADCRUMB
     Стиль: спортивный / фитнес / современный
============================================ -->

<div th:fragment="admin-breadcrumb" class="adminBreadcrumbContainer">
    <div class="activitar-admin-breadcrumb set-bg spad"
         th:each="current: ${setting}"
         th:if="${current.section == 'breadcrumb'}"
         th:attr="data-setbg=@{${current.imageName != null and !current.imageName.isEmpty() ?
                                   '/images/' + current.imageName :
                                   '/img/breadcrumb-bg-default.jpg'}}">

        <!-- Декоративные элементы (актив/фитнес стиль) -->
        <div class="breadcrumb-overlay"></div>
        <div class="breadcrumb-pattern"></div>

        <!-- Анимированные круги (как на основном сайте) -->
        <div class="breadcrumb-circle-1"></div>
        <div class="breadcrumb-circle-2"></div>
        <div class="breadcrumb-circle-3"></div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="activitar-breadcrumb-content">
                        <!-- Иконка / логотип -->
                        <div class="breadcrumb-icon">
                            <i class="fa fa-shield"></i>
                        </div>

                        <!-- Заголовок -->
                        <h1 class="breadcrumb-title">
                            <span class="title-main">Admin</span>
                            <span class="title-accent">Панель</span>
                        </h1>

                        <!-- Навигация -->
                        <div class="breadcrumb-nav">
                            <a href="/" class="nav-home">
                                <i class="fa fa-home"></i>
                                <span>Главная</span>
                            </a>
                            <span class="nav-separator">
                                <i class="fa fa-angle-right"></i>
                            </span>
                            <span class="nav-current">Админ панель</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Breadcrumb End -->
<!-- Модальное окно -->
<div th:replace="~{modal::modal}"></div>
<!-- Модальное окно End -->
<div class="gallery-section spad">
    <div class="container">
        <!-- Nav tabs -->
        <ul class="nav nav-pills-dark nav-justified nav-tabs" role="tablist">
            <li class="nav-item ">
                <a class="nav-link active" data-toggle="tab" onclick="updateAdminFragment(this.href)"
                   href="/admin/home"><p>Главная</p></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="updateAdminFragment(this.href)" data-toggle="tab" href="/admin/gallery"><p>
                    Галерея</p></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="updateAdminFragment(this.href)" data-toggle="tab" href="/admin/sketches">
                    <p>Эскизы</p></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="updateAdminFragment(this.href)" data-toggle="tab" href="/admin/blog"><p>
                    Блог</p></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="updateAdminFragment(this.href)" data-toggle="tab" href="/admin/reviews"><p>
                    Отзывы</p></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="updateAdminFragment(this.href)" data-toggle="tab" href="/admin/setting"><p>
                    Настройки</p></a>
            </li>
        </ul>
        <!-- End nav tabs -->
        <!-- Tab panes -->
        <div class="tab-content">
            <div th:replace="~{fragment-admin::fragment-tab}"></div>
        </div>
    </div>
</div>
<!-- Footer Section Begin -->
<div class="footer-section" th:fragment="footer-section">
    <div th:replace="~{fragments::footer}"></div>
</div>
<!-- Footer Section End -->
<!-- Js Plugins -->
<script type="text/javascript" th:src="@{/static/js/jquery-3.3.1.min.js}"></script>
<script type="text/javascript" th:src="@{/static/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/static/js/jquery.magnific-popup.min.js}"></script>
<script type="text/javascript" th:src="@{/static/js/mixitup.min.js}"></script>
<script type="text/javascript" th:src="@{/static/js/jquery.nice-select.min.js}"></script>
<script type="text/javascript" th:src="@{/static/js/jquery.slicknav.js}"></script>
<script type="text/javascript" th:src="@{/static/js/owl.carousel.min.js}"></script>
<script type="text/javascript" th:src="@{/static/js/masonry.pkgd.min.js}"></script>
<script type="text/javascript" th:src="@{/static/js/main.js}"></script>
<script type="text/javascript" th:src="@{/static/js/admin.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mixitup/3.3.2/mixitup.min.js"></script>
</body>
</html>
