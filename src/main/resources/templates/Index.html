<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:with="homeSeo=${setting.^[section == 'home-title']},
               logoSetting=${setting.^[section == 'logo']}">

    <meta charset="UTF-8">
    <!-- H1 FIX: CSRF meta-теги для AJAX-запросов -->
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <meta name="zen-verification" content="Qs3KIKkBpZHRG9QIS3E1heKpO8wXZqWQbhTTWt7wQrr7XB6Iexi1cA15htzot9cG"/>
    <th:block th:fragment="verificationMetaTags">
        <!-- Яндекс верификация (мета-тег) -->
        <th:block th:if="${yandexMeta != null}">
            <meta name="yandex-verification" th:content="${yandexMeta.value}" />
        </th:block>

        <!-- Google верификация (мета-тег) -->
        <th:block th:if="${googleMeta != null}">
            <meta name="google-site-verification" th:content="${googleMeta.value}" />
        </th:block>
    </th:block>
    <!-- SEO данные с проверкой на null -->
    <meta name="description" th:content="${homeSeo?.description}">
    <meta name="keywords" th:content="${homeSeo?.description}">
    <title th:text="${homeSeo?.title}">Tattoo Studio</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Favicon с проверкой на null -->
    <link th:if="${logoSetting != null}"
          th:href="@{'/images/' + ${logoSetting.imageName}}"
          rel="icon" type="image/vnd.microsoft.icon">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,500,600,700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" th:href="@{/static/css/bootstrap.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/font-awesome.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/elegant-icons.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/nice-select.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/owl.carousel.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/magnific-popup.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/slicknav.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/main.css}" type="text/css">

    <script>window.yaContextCb = window.yaContextCb || []</script>
    <script src="https://vk.com/js/api/videoplayer.js"></script>
    <script src="https://yandex.ru/ads/system/context.js" async></script>

    <!-- Analytics -->
    <div th:replace="~{fragments/index/analytics-head :: analytics-head}"></div>

</head>

<body>
<!-- Page Preloder -->
<div id="preloder">
    <div class="loader"></div>
</div>

<!-- Header Section Begin -->
<div th:replace="~{fragments::header}"></div>
<!-- Header End -->

<!-- Hero Section Begin -->
<div th:replace="~{fragments/index/hero :: hero}"></div>
<!-- Hero End -->

<!-- Feature Section Begin -->
<div th:replace="~{fragments/index/features :: features}"></div>
<!-- Feature Section End -->

<!-- About Section Begin -->
<div th:replace="~{fragments/index/about :: about}"></div>
<!-- About Section End -->

<!-- Classes Section Begin -->
<div th:replace="~{fragments/index/classes :: classes}"></div>
<!-- Classes Section End -->

<!-- Price Plan Section Begin -->
<div th:replace="~{fragments/index/price :: price}"></div>
<!-- Price Plan Section End -->

<!-- Choseus Section Begin -->
<div th:replace="~{fragments/index/chooseus :: chooseus}"></div>
<!-- Choseus Section End -->

<!-- Video Section Begin -->
<div th:replace="~{fragments/index/video :: video}"></div>
<!-- Video Section End -->

<!-- Video Modal -->
<div th:replace="~{fragments/modals/video :: video}"></div>
<!-- Video Modal End -->

<!-- Reviews Section Begin -->
<div th:replace="~{fragments/index/reviews :: reviews}"></div>
<!-- Reviews Section End -->

<!-- Cta Section Begin -->
<div th:replace="~{fragments::cta-section}"></div>
<!-- Cta Section End -->

<!-- Map Section Begin -->
<div th:replace="~{fragments/index/map :: map}"></div>
<!-- Map Section End -->

<!-- Footer Section Begin -->
<div class="footer-section">
    <div th:replace="~{fragments::footer}"></div>
</div>
<!-- Footer Section End -->

<!-- Js Plugins & Modules -->
<div th:replace="~{fragments/index/scripts :: scripts}"></div>

<!-- Analytics (body) -->
<div th:replace="~{fragments/index/analytics-body :: analytics-body}"></div>

</body>

</html>
