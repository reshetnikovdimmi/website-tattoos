            <meta name="yandex-verification" th:content="${yandexMeta.value}" />

    <!-- Favicon с проверкой на null -->
    <link th:if="${logoSetting != null}"

    <link rel="stylesheet" th:href="@{/static/css/slicknav.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/static/css/main.css}" type="text/css">

    <script>window.yaContextCb = window.yaContextCb || []</script>
