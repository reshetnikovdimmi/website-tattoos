<!DOCTYPE html>
<th:block xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <!-- Соцсети и авторизация (общий для desktop и mobile) -->
    <th:block th:fragment="socials">
        <a href="https://wa.me/9069917226" target="_blank"><i class="fa fa-whatsapp"></i></a>
        <a sec:authorize="!isAuthenticated()" href="/login"><i class="fa fa-user" aria-hidden="true"></i></a>
        <!-- H1 FIX: Logout via POST with CSRF token (only for authenticated users) -->
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.headerName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-btn">
                <i class="fa fa-sign-out" aria-hidden="true"></i>
            </button>
        </form>
        <a sec:authorize="hasAuthority('ADMIN')" href="/admin"><i class="fa fa-cogs" aria-hidden="true"></i></a>
        <a sec:authorize="hasAuthority('USER')" href="/lk"><i class="fa fa-user-circle" aria-hidden="true"></i></a>
    </th:block>
</th:block>
