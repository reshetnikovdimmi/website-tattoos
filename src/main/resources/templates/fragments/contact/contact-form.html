<!DOCTYPE html>
<th:block xmlns:th="http://www.thymeleaf.org">
    <div class="info-block contact-form" th:fragment="contact-form">
        <h5>СВЯЗАТЬСЯ</h5>
        <form th:method="POST"
              th:action="@{/contact/send-mail}"
              th:object="${details}"
              data-form="contact">

            <input type="text" name="name" placeholder="Имя" required>
            <input type="tel" name="subject" class="phone" placeholder="Телефон" required>
            <textarea name="msgBody" placeholder="Сообщение" required></textarea>

            <!-- Honeypot field for spam protection (hidden from humans) -->
            <input type="text" name="website-url" id="honeypot" tabindex="-1" autocomplete="off" class="visually-hidden" readonly>

            <button type="submit">ОТПРАВИТЬ</button>
            <div class="status-message" th:text="${status}"></div>
        </form>
    </div>
</th:block>
