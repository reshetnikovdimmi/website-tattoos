<!DOCTYPE html>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="chooseus">
    <!-- Choseus Section Begin -->
    <section class="chooseus-section spad">
        <div class="container" th:each="current : ${carousel}">

            <!-- ЕСТЬ ЗАПИСИ (chooseus не пустой) -->
            <div th:if="${current.chooseus != null and !current.chooseus.isEmpty()}">
                <!-- Заголовок (если есть categoryTitle) -->
                <div class="row">
                    <div class="col-lg-12" th:each="currents : ${current.chooseus}" th:if="${currents.categoryTitle}">
                        <div class="section-title">
                            <h2 th:text="${currents.title}">Почему выбирают нас</h2>
                            <p class="short-details" th:text="${currents.description}">Описание преимуществ</p>
                        </div>
                    </div>
                </div>

                <!-- Карточки преимуществ -->
                <div class="row">
                    <div class="col-lg-4 col-sm-6" th:each="currents : ${current.chooseus}"
                         th:unless="${currents.categoryTitle}">
                        <div class="choose-item">
                            <img alt="" th:src="@{'/images/'+${currents.imageName}}">
                            <h5 th:text="${currents.title}"></h5>
                            <p class="short-details" th:text="${currents.description}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- НЕТ ЗАПИСЕЙ (chooseus пустой или null) -->
            <div th:if="${current.chooseus == null or current.chooseus.isEmpty()}">
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <div class="section-title">
                            <h2>Почему выбирают нас</h2>
                            <p class="short-details">Добавьте преимущества в админ-панели</p>
                            <a href="/admin" class="primary-btn">Добавить преимущества</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>
    <!-- Choseus Section End -->
</th:block>
