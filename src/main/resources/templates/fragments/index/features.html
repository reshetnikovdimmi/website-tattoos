<!DOCTYPE html>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="features">
    <!-- Feature Section Begin -->
    <section class="feature-section">
        <div class="container-fluid">

            <!-- ОСНОВНОЙ БЛОК: Показываем, если carousel существует и не пуст -->
            <div class="row" th:if="${carousel != null and !carousel.isEmpty()}">
                <div class="col-lg-4 col-md-6" th:each="feature : ${carousel[0].feature}">
                    <div class="feature-item set-bg"
                         th:attr="data-setbg=@{${feature.imageName != null and !feature.imageName.isEmpty() ? '/images/' + feature.imageName : '/img/avatar.jpg'}}">
                        <h3 th:text="${feature.title}">Заголовок</h3>
                        <p class="short-details" th:text="${feature.description}">Описание</p>
                        <a href="/sketches" class="primary-btn f-btn">Подробнее</a>
                    </div>
                </div>
            </div>

            <!-- ПУСТОЕ СОСТОЯНИЕ: Показываем, если carousel пуст или отсутствует -->
            <div class="row" th:if="${carousel == null or carousel.isEmpty() or carousel[0].feature == null or carousel[0].feature.isEmpty()}">

                <!-- Цикл от 1 до 3 для создания трех карточек -->
                <div th:each="i, iterStat : ${#numbers.sequence(1, 3)}"
                     th:class="${iterStat.index == 2} ? 'col-lg-4 col-md-12' : 'col-lg-4 col-md-6'">

                    <div class="feature-item set-bg" data-setbg="/img/avatar.jpg">
                        <!-- Заголовок с номером -->
                        <h3 th:text="'Преимущество ' + ${i}">Преимущество 1</h3>

                        <!-- Разные описания для каждой карточки -->
                        <p th:switch="${i}">
                            <span th:case="1">Добавьте описание преимущества в админ-панели</span>
                            <span th:case="2">Расскажите о своих сильных сторонах</span>
                            <span th:case="3">Почему клиенты выбирают именно вас</span>
                        </p>

                        <a href="/admin" class="primary-btn f-btn">Добавить</a>
                    </div>
                </div>
            </div>

        </div>
    </section>
    <!-- Feature Section End -->
</th:block>
