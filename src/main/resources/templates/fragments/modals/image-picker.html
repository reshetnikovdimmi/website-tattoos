<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Image Picker Modal</title>
</head>
<body>
<!-- M4 — Выбор изображения (Bootstrap 4.4.1) -->
<div th:fragment="image-picker">
    <div class="modal fade" id="infoModal" data-backdrop="static" data-keyboard="false" tabindex="-1"
         aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Выберите изображение</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="container-fluid">
                        <div class="gallery-filter-modal">
                            <div class="row gallery-filter" th:each="currents: ${gallery.galleryImg}">
                                <div class="col-lg-4 col-sm-6 mix" th:each="img: ${currents}">
                                    <div class="gallery-modal-item">
                                        <img onclick="selectReviewImage(this.alt)"
                                             th:alt="${img.imageName}"
                                             th:src="@{'/images/'+${img.imageName}}"
                                             class="gallery-modal-img">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="blog-option">
                        <div class="blog-pagination">
                            <a th:if="${gallery.currentPage != 0}"
                               th:onclick="goToPageGalleryReviews([[${gallery.currentPage - 1}]], [[${gallery.number}]])"
                               class="page-nav">
                                <i class="fa fa-long-arrow-left"></i>
                            </a>
                            <a class="active">[[${gallery.currentPage + 1}]]</a>
                            <span class="page-separator">из</span>
                            <a>[[${gallery.pageSize}]]</a>
                            <a th:if="${gallery.currentPage + 1 != gallery.pageSize}"
                               th:onclick="goToPageGalleryReviews([[${gallery.currentPage + 1}]], [[${gallery.number}]])"
                               class="page-nav">
                                <i class="fa fa-long-arrow-right"></i>
                            </a>
                        </div>
                        <div class="blog-option-right">
                            <div class="blog-result">
                                Показано [[${gallery.currentPage * gallery.number + 1}]]–[[${gallery.currentPage *
                                gallery.number + gallery.number}]]
                                из [[${gallery.imagesTotal}]]
                            </div>
                            <div class="show-result">
                                <label for="Size" class="show-result-label">Показывать:</label>
                                <select id="Size"
                                        class="show-result-select no-nice-select"
                                        th:onchange="goToPageGalleryReviews([[${gallery.currentPage}]], this.value)">
                                    <option th:each="option : ${gallery.select}"
                                            th:value="${option}"
                                            th:text="${option}"
                                            th:selected="${option == gallery.number}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
