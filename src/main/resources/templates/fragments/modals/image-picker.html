<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Image Picker Modal</title>
</head>
<body>
<!-- M4 — Выбор изображения (Bootstrap 4.4.1) -->
<div th:fragment="image-picker">
    <div class="modal fade" id="infoModal" data-backdrop="static" data-keyboard="false" tabindex="-1"
         aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Выберите изображение</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="container-fluid">
                        <div class="gallery-filter-modal">
                            <div class="row gallery-filter">
                                <div class="col-lg-4 col-sm-6 mix" th:each="img : ${gallery.items}">
                                    <div class="gallery-modal-item">
                                        <img onclick="selectReviewImage(this.alt)"
                                             th:alt="${img.imageName}"
                                             th:src="@{'/images/'+${img.imageName}}"
                                             class="gallery-modal-img">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="blog-option">
                        <div class="blog-pagination" role="navigation" aria-label="Пагинация изображений">
                            <a th:if="${gallery.page != 0}"
                               th:href="@{'/gallery/reviews/' + (gallery.page - 1) + '/' + gallery.size}"
                               th:attr="data-review-page=${gallery.page - 1}, data-review-size=${gallery.size}"
                               class="page-nav" aria-label="Предыдущая страница">
                                <i class="fa fa-long-arrow-left"></i>
                            </a>
                            <span class="active pagination__current" aria-current="page" th:text="${gallery.page + 1}">1</span>
                            <span class="page-separator">из</span>
                            <span class="pagination__total" th:text="${gallery.totalPages}">1</span>
                            <a th:if="${gallery.page + 1 < gallery.totalPages}"
                               th:href="@{'/gallery/reviews/' + (gallery.page + 1) + '/' + gallery.size}"
                               th:attr="data-review-page=${gallery.page + 1}, data-review-size=${gallery.size}"
                               class="page-nav" aria-label="Следующая страница">
                                <i class="fa fa-long-arrow-right"></i>
                            </a>
                        </div>
                        <div class="blog-option-right">
                            <div class="blog-result">
                                Показано <span th:text="${gallery.page * gallery.size + 1}">1</span>–
                                <span th:text="${(gallery.page + 1) * gallery.size > gallery.totalElements
                                                ? gallery.totalElements : (gallery.page + 1) * gallery.size}">9</span>
                                из <span th:text="${gallery.totalElements}">0</span>
                            </div>
                            <div class="show-result">
                                <label for="Size" class="show-result-label">Показывать:</label>
                                <select id="Size"
                                        class="show-result-select no-nice-select"
                                        data-review-size
                                        th:attr="data-review-page=${gallery.page}">
                                    <option th:each="option : ${gallery.select}"
                                            th:value="${option}"
                                            th:text="${option}"
                                            th:selected="${option == gallery.size}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
