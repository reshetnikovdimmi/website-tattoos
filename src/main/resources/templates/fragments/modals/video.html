<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Video Modal</title>
</head>
<body>
<!-- M2 — Видео (Custom BEM) -->
<div th:fragment="video">
    <div class="custom-modal custom-modal--video" id="videoModal">
        <div class="custom-modal__content">
            <div class="custom-modal__header">
                <h5 class="custom-modal__title" id="videoModalTitle">Название видео</h5>
                <button class="custom-modal__close" id="videoModalClose" type="button" aria-label="Close">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="custom-modal__body">
                <div class="custom-modal__player">
                    <iframe id="videoModalIframe"
                            src=""
                            frameborder="0"
                            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                            allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
