<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--Admin Navigation Fragment -->
<div th:fragment="fragment-tab" class="container tab-pane active"><br>
    <div class="row">
        <div class="col-6 col-md-4 themed-grid-col">
            <div class="nav flex-column nav-pills" id="v-home-tab" role="tablist"
                 aria-orientation="vertical">
                <!-- Главная -->
                <div class="menu-group" data-group="home">
                    <a class="nav-link active btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-carousel-tab" data-toggle="pill" href="#v-pills-carousel" role="tab"
                       aria-controls="v-pills-carousel" aria-selected="true">carousel</a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-feature-tab"
                       data-toggle="pill" href="#v-pills-feature" role="tab"
                       aria-controls="v-pills-featur" aria-selected="false">feature-section</a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-about-tab"
                       data-toggle="pill" href="#v-pills-about" role="tab"
                       aria-controls="v-pills-about" aria-selected="false">home-about</a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-classes-tab"
                       data-toggle="pill" href="#v-pills-classes" role="tab"
                       aria-controls="v-pills-classes" aria-selected="false">classes-section</a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-price-tab"
                       data-toggle="pill" href="#v-pills-price" role="tab"
                       aria-controls="v-pills-price" aria-selected="false">price-section</a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-video-tab"
                       data-toggle="pill" href="#v-pills-video" role="tab"
                       aria-controls="v-pills-video" aria-selected="false">video-section</a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-chooseus-tab"
                       data-toggle="pill" href="#v-pills-chooseus" role="tab"
                       aria-controls="v-pills-chooseus" aria-selected="false">chooseus-section</a>
                </div>
                <!-- Галерея -->
                <div class="menu-group" data-group="gallery" style="display:none;">
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-gallery-tab"
                       data-toggle="pill"
                       href="#v-gallery"
                       role="tab"
                       aria-controls="v-gallery"
                       aria-selected="false">
                        Галерея
                    </a>
                </div>
                <!-- Эскизы -->
                <div class="menu-group" data-group="sketches" style="display:none;">
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-sketches-tab"
                       data-toggle="pill"
                       href="#v-pills-sketches-tab"
                       role="tab"
                       aria-controls="v-pills-sketches-tab"
                       aria-selected="false">
                        Эскизы
                    </a>
                </div>
                <!-- Блог -->
                <div class="menu-group" data-group="blog" style="display:none;">
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-blog-tab"
                       data-toggle="pill"
                       href="#v-pills-blog-tab"
                       role="tab"
                       aria-controls="v-pills-blog-tab"
                       aria-selected="false">
                        Блог
                    </a>
                </div>
                <!-- Отзывы -->
                <div class="menu-group" data-group="reviews" style="display:none;">
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-reviews-all-tab"
                       data-toggle="pill"
                       href="#v-reviews-all"
                       role="tab"
                       aria-controls="v-reviews-all"
                       aria-selected="false">
                        Отзывы
                    </a>
                </div>
                <!-- Настройки -->
                <div class="menu-group" data-group="settings" style="display:none;">
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-users-tab"
                       data-toggle="pill"
                       href="#v-pills-users"
                       role="tab"
                       aria-controls="v-pills-users"
                       aria-selected="true">
                        Пользователи
                    </a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-pills-contact-tab"
                       data-toggle="pill"
                       href="#v-pills-contact"
                       role="tab"
                       aria-controls="v-pills-contact"
                       aria-selected="false">
                        Контакты
                    </a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-breadcrumb-section-tab"
                       data-toggle="pill"
                       href="#v-breadcrumb-section"
                       role="tab"
                       aria-controls="v-breadcrumb-section"
                       aria-selected="false">
                        Хлебные крошки
                    </a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-logo-tab"
                       data-toggle="pill"
                       href="#v-logo"
                       role="tab"
                       aria-controls="v-logo"
                       aria-selected="false">
                        Логотип
                    </a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-head-tab"
                       data-toggle="pill"
                       href="#v-head"
                       role="tab"
                       aria-controls="v-head"
                       aria-selected="false">
                        Заголовок
                    </a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-footer-tab"
                       data-toggle="pill"
                       href="#v-footer"
                       role="tab"
                       aria-controls="v-footer"
                       aria-selected="false">
                        Футер
                    </a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-mail-tab"
                       data-toggle="pill"
                       href="#v-mail"
                       role="tab"
                       aria-controls="v-mail"
                       aria-selected="false">
                        Почта
                    </a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-SiteVerification-tab"
                       data-toggle="pill"
                       href="#v-SiteVerification"
                       role="tab"
                       aria-controls="v-SiteVerification"
                       aria-selected="false">
                        Верификация
                    </a>
                    <a class="nav-link btn btn-outline-secondary" style="margin: 10px;"
                       id="v-backup-tab"
                       data-toggle="pill"
                       href="#v-backup"
                       role="tab"
                       aria-controls="v-backup"
                       aria-selected="false">
                        Бэкап
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-8 themed-grid-col">
            <div class="tab-content" id="v-carousel-tabContent">
                <div th:replace="~{fragment-admin/home :: home}"></div>
                <div th:replace="~{fragment-admin/gallery :: gallery}"></div>
                <div th:replace="~{fragment-admin/sketches :: sketches}"></div>
                <div th:replace="~{fragment-admin/blog :: blog}"></div>
                <div th:replace="~{fragment-admin/reviews :: reviews}"></div>
                <div th:replace="~{fragment-admin/settings :: setting}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
