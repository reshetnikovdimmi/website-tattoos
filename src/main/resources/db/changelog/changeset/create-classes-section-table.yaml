databaseChangeLog:
  - changeSet:
      id: create-classes-section-table
      author: Dmitrii
      changes:
        - createTable:
            tableName: classes_section
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: home_id
                  type: bigint
              - column:
                  name: image_name
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: name
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: description
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: details
                  type: longtext character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: category_title
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: section
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci

  - changeSet:
      id: add-fk-from-classes-to-home
      author: Dmitrii
      changes:
        - addForeignKeyConstraint:
            baseTableName: classes_section
            baseColumnNames: home_id
            referencedTableName: home
            referencedColumnNames: id
            constraintName: fk_classes_section_to_home