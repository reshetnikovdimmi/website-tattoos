databaseChangeLog:
  - changeSet:
      id: create-blog-table
      author: Dmitrii
      changes:
        - createTable:
            tableName: blog
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: image_name
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: description
                  type: TEXT character set utf8mb4 collate utf8mb4_unicode_ci
                  # ИСПРАВЛЕНО: TEXT вместо varchar(255) для длинных описаний
              - column:
                  name: title
                  type: longtext character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: subtitle
                  type: longtext character set utf8mb4 collate utf8mb4_unicode_ci
                  # ИСПРАВЛЕНО: TEXT вместо varchar(255) для длинных подзаголовков
              - column:
                  name: content
                  type: longtext character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: section
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: date
                  type: date

  # ИСПРАВЛЕНИЕ: Изменяем тип существующих колонок (миграция)
  - changeSet:
      id: fix-blog-column-types
      author: Dmitrii
      changes:
        - modifyDataType:
            tableName: blog
            columnName: subtitle
            newDataType: TEXT character set utf8mb4 collate utf8mb4_unicode_ci
        - modifyDataType:
            tableName: blog
            columnName: description
            newDataType: TEXT character set utf8mb4 collate utf8mb4_unicode_ci
        - modifyDataType:
            tableName: blog
            columnName: content
            newDataType: TEXT character set utf8mb4 collate utf8mb4_unicode_ci

  - changeSet:
      id: add-data-blog-text
      author: Dmitrii
      changes:
        - insert:
            tableName: blog
            columns:
              - column:
                  name: section
                  value: blog-text
              - column:
                  name: title
                  value: "title placeholder"
              - column:
                  name: subtitle
                  value: "subtitle placeholder"
              - column:
                  name: content
                  value: "content placeholder"

  - changeSet:
      id: add-data-blog-title
      author: Dmitrii
      changes:
        - insert:
            tableName: blog
            columns:
              - column:
                  name: section
                  value: blog-title
              - column:
                  name: title
                  value: "title placeholder"
              - column:
                  name: subtitle
                  value: "subtitle placeholder"
              - column:
                  name: content
                  value: "content placeholder"

  - changeSet:
      id: add-data-blog-quote
      author: Dmitrii
