                  value: blog-quote
              - column:
                  name: title
                  value: "title placeholder"
              - column:
                  name: subtitle
                  value: "subtitle placeholder"
              - column:
                  name: content
                  value: "content placeholder"
        - insert:
            tableName: blog
            columns:
              - column:
                  name: section
                  value: blog-more-title
              - column:
                  name: title
                  value: "title placeholder"
              - column:
                  name: subtitle
                  value: "subtitle placeholder"
              - column:
                  name: content
                  value: "content placeholder"
        - insert:
            tableName: blog
