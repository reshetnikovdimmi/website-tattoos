databaseChangeLog:
  - changeSet:
      id: create-chooseus-section-table
      author: Dmitrii
      changes:
        - createTable:
            tableName: chooseus_section
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: home_id
                  type: bigint
              - column:
                  name: image_name
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: title
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: description
                  type: longtext character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: icon_class
                  type: longtext character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: feature_1
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: feature_2
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: category_title
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: section
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci

  - changeSet:
      id: add-fk-from-chooseus-to-home
      author: Dmitrii
      changes:
        - addForeignKeyConstraint:
            baseTableName: chooseus_section
            baseColumnNames: home_id
            referencedTableName: home
            referencedColumnNames: id
            constraintName: fk_chooseus_section_to_home