databaseChangeLog:
  - changeSet:
      id: 2026-09-06-001
      author: reshetnikovdimmi
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: site_verification
      changes:
        - createTable:
            tableName: site_verification
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: engine
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: method
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: verification_value
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: file_content
                  type: VARCHAR(2000)
                  constraints:
                    nullable: true
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: true
              - column:
                  name: verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: true

        - createIndex:
            tableName: site_verification
            indexName: idx_verification_engine_method_active
            columns:
              - column:
                  name: engine
              - column:
                  name: method
              - column:
                  name: is_active

        - createIndex:
            tableName: site_verification
            indexName: idx_verification_engine
            columns:
              - column:
                  name: engine

      rollback:
        - dropTable:
            tableName: site_verification