databaseChangeLog:
  - changeSet:
      id: create-videos-table
      author: Dmitrii
      changes:
        - createTable:
            tableName: videos
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: home_id
                  type: bigint
              - column:
                  name: title
                  type: varchar(255) character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: description
                  type: longtext character set utf8mb4 collate utf8mb4_unicode_ci
              - column:
                  name: video_url
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: preview_image
                  type: varchar(255)
              - column:
                  name: display_order
                  type: int
                  defaultValueNumeric: 0
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: "CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP"
  - changeSet:
     id: add-fk-from-classes-to-home
     author: Dmitrii
     changes:
       - addForeignKeyConstraint:
           baseTableName: videos
           baseColumnNames: home_id
           referencedTableName: home
           referencedColumnNames: id
           constraintName: fk_videos_to_home